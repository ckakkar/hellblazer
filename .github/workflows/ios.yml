name: iOS

# Builds the native iOS shell. Web changes never need this: the app loads the
# live site, so a Vercel deploy updates it. This runs when the native project
# changes, or by hand from the Actions tab (Run workflow).
#
# It uploads a TestFlight build when signing is set up (IOS_TEAM_ID, set by
# scripts/ios-signing-setup.mjs) and uploads are switched on (IOS_TESTFLIGHT
# = on, once the App Group and the App Store Connect app record exist).
# Otherwise, or when started by hand with "compile only", it just checks
# that the app compiles.
on:
  workflow_dispatch:
    inputs:
      compile_only:
        description: Compile only, no TestFlight upload
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "app-shell/**"
      - "capacitor.config.ts"
      - ".github/workflows/ios.yml"

# One at a time, and never cancel a run midway through an upload.
concurrency:
  group: ios
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ (vars.IOS_TEAM_ID && vars.IOS_TESTFLIGHT == 'on' && !inputs.compile_only) && 'TestFlight' || 'Compile check' }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      UPLOAD: ${{ vars.IOS_TEAM_ID != '' && vars.IOS_TESTFLIGHT == 'on' && !inputs.compile_only }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Copies app-shell and the config into the Xcode project and wires the
      # plugins' Swift packages (those files are generated, not committed).
      - name: Sync native project
        run: npx cap sync ios

      - name: Xcode version
        run: xcodebuild -version

      - name: Compile check (unsigned)
        if: ${{ env.UPLOAD != 'true' }}
        run: >
          xcodebuild -quiet
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          build

      - uses: ruby/setup-ruby@v1
        if: ${{ env.UPLOAD == 'true' }}
        with:
          ruby-version: "3.3"

      - name: Install fastlane
        if: ${{ env.UPLOAD == 'true' }}
        run: gem install fastlane --no-document

      - name: Build and upload to TestFlight
        if: ${{ env.UPLOAD == 'true' }}
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_CERT_ID: ${{ vars.IOS_CERT_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: fastlane beta

      # TestFlight's "What to Test": the commit's message, minus trailers.
      # Cosmetic, so it can't fail the run.
      - name: Set What to Test
        if: ${{ env.UPLOAD == 'true' }}
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          export TESTFLIGHT_NOTES="$(git log -1 --format=%B | grep -viE '^(co-authored-by|claude-session):' || true)"
          node scripts/testflight-notes.mjs
