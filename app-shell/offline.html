<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fatty</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #000; color: #e6e9ef; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; text-align: center;
      }
      svg { width: 44px; height: 44px; }
      h1 { margin: 8px 0 0; font-size: 20px; font-weight: 600; }
      p { margin: 0; max-width: 280px; color: #8b93a1; }
      button {
        margin-top: 12px; min-width: 160px; height: 48px; border: 0; border-radius: 14px;
        background: #e6e9ef; color: #000; font: inherit; font-weight: 600;
      }
      button:active { opacity: 0.8; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 24 24" fill="none" stroke="#df2d28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" />
    </svg>
    <h1>You're offline</h1>
    <p>Fatty needs a connection the first time it opens. Sets you log later are saved even without signal.</p>
    <button type="button" onclick="location.replace('https://hellblazer.vercel.app/dashboard')">Try again</button>
  </body>
</html>
